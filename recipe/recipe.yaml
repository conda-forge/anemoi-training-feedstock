schema_version: 1

context:
  version: "0.18.1"

package:
  name: anemoi-training
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/a/anemoi-training/anemoi_training-${{ version }}.tar.gz
  sha256: 63f0cc461dff32d81ffd64c176e0f67b8a5cb20f0f71b39ec6ee85cf5b544b97

build:
  number: 1
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation
  python:
    entry_points:
      - _anemoi-training-evaluate = anemoi.training.commands.evaluate:main
      - _anemoi-training-profile = anemoi.training.commands.profiler:main
      - _anemoi-training-train = anemoi.training.commands.train:main
      - anemoi-training = anemoi.training.__main__:main

requirements:
  host:
    - python ${{ python_min }}.*
    - setuptools >=60
    - setuptools-scm >=8
    - pip
  run:
    - python >=${{ python_min }}
    - anemoi-datasets >=0.5.38
    - anemoi-graphs >=0.5.2
    - anemoi-models >=0.9.5
    - anemoi-transform >=0.4.1
    - anemoi-utils >=0.5.1
    - einops >=0.6.1
    - hydra-core >=1.3
    - numba
    - numpy
    - nvidia-ml-py >=13.580.82
    - pydantic >=2.9
    - pytorch-lightning >=2.6
    - timm >=0.9.2
    - pytorch >=2.6,<2.12
    - torchdata >=0.11
    - pytorch_geometric >=2.3.1
    - torchinfo >=1.8
    - torchvision >=0.18
    - tqdm >=4.65

tests:
  - python:
      imports:
        - anemoi
        - hydra_plugins
      pip_check: false
      python_version:
        - ${{ python_min }}.*
        - "*"
  - requirements:
      run:
        - pip
        - python ${{ python_min }}.*
    script:
      - anemoi-training --help

about:
  summary: A package to hold various functions to support training of ML models.
  license: Apache-2.0
  license_file: LICENSE
  homepage: https://github.com/ecmwf/anemoi-core/
  documentation: https://anemoi-training.readthedocs.io/

extra:
  recipe-maintainers:
    - tjtg
    - jasonjunweilyu
    - HCookie
